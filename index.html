<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WVSU Main Campus Portal - Log In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <p class="header-title">
          <span class="school">West Visayas State University</span>
          <span class="portal">Main Campus Portal</span>
        </p>
      </div>
    </header>

    <main class="page-shell">
      <section class="portal-panel" aria-label="Main Campus Portal">
        <section class="login-box" aria-label="Login form">
          <img class="seal" src="assets/wvsu-seal-cropped.png" alt="West Visayas State University seal" />

          <div class="box-heading centered">
            <span class="eyebrow" id="login-context">Student Portal</span>
            <h1 id="login-title">Student Log In</h1>
            <p class="login-description" id="login-description">Access your student records and progress page.</p>
          </div>

          <form class="login-form">
            <label for="user-type">User Type</label>
            <select id="user-type" name="user-type">
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
              <option value="admin">Admin</option>
              <option value="application">Application</option>
            </select>

            <label for="user-id" id="user-id-label">Student ID No.</label>
            <input
              id="user-id"
              name="user-id"
              type="text"
              autocomplete="username"
              placeholder="Enter your student ID"
              required
            />

            <fieldset class="date-field">
              <legend>Date of Birth</legend>
              <div class="date-selects">
                <select id="birth-year" name="birth-year" aria-label="Birth year" autocomplete="bday-year" required>
                  <option value="" selected disabled>Year</option>
                </select>
                <select id="birth-month" name="birth-month" aria-label="Birth month" autocomplete="bday-month" required disabled>
                  <option value="" selected disabled>Month</option>
                </select>
                <select id="birth-day" name="birth-day" aria-label="Birth day" autocomplete="bday-day" required disabled>
                  <option value="" selected disabled>Day</option>
                </select>
              </div>
            </fieldset>

            <label for="password" id="password-label">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />

            <div class="form-actions">
              <button class="secondary-button" type="button">Forgot Password</button>
              <button class="primary-button" type="submit" id="submit-button">Next</button>
            </div>

            <p class="form-status" role="status" aria-live="polite"></p>
          </form>

          <p class="apply-prompt">
            New applicant?
            <a
              href="https://iuis.wvsu.edu.ph/iuis/applicants/index.php"
              target="_blank"
              rel="noopener noreferrer"
            >Open the application form</a>
          </p>
        </section>
      </section>

      <img class="privacy-badge" src="assets/dpo-dps.png" alt="DPO and DPS registration badge" />
    </main>

    <footer class="site-footer">
      <a href="#">Terms &amp; Support</a>
      <a href="#">Privacy Policy</a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
